name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      # Placeholders. NEXT_PUBLIC_ values are inlined at build time; CI never talks to a real project.
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:55321
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: sb_publishable_ci_placeholder_not_a_key
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build

  database:
    name: Migrations, RLS, integration tests and evals
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Start local Supabase (database, auth, API, realtime)
        run: pnpm exec supabase start
      - name: pgTAP (roles, RLS, signup trigger)
        run: pnpm exec supabase test db
      - name: Integration tests (as a login role identical to aoc_service)
        run: pnpm test:integration
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
      - name: Evals (replay-all, recorded tools and model, through the production code path)
        run: pnpm --filter @aoc/evals eval --mode replay-all
        env:
          SUPABASE_DB_URL: postgresql://postgres:postgres@127.0.0.1:55322/postgres
